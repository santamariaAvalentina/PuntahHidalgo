    <script>
    function enviarReservaWhatsApp() {
        const campo = document.getElementById("cantidad_personas");

        if (!campo) {
            alert("No encuentro el campo de cantidad de personas.");
            return;
        }

        const cantidad = Number(campo.value);

        if (!Number.isInteger(cantidad) || cantidad < 1) {
            alert("Por favor, ingresá una cantidad válida de personas.");
            campo.focus();
            return;
        }

        const telefono = "5493517325619";
        const mensaje = `Hola, Punta Hidalgo. Quiero hacer una reserva para ${cantidad} personas. ¿Me pueden confirmar la disponibilidad?`;

        const url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(mensaje);

        window.location.href = url;
    }
</script>
